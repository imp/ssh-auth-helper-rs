[package]
name = "ssh-auth-helper"
version = "0.1.0"
edition = "2024"

[dependencies]
camino = { version = "1", features = ["serde1"] }
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
jiff = { version = "0.2", default-features = false, features = ["serde", "std"] }
parking_lot = "0.12"
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
uuid = { version = "1.27", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
