[package]
name = "ssh-auth-helper"
version = "0.1.0"
edition = "2024"

[dependencies]
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive"] }
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
parking_lot = "0.12"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
