[workspace]
resolver = "3"
members = ["jsonrpc-uds", "ssh-auth-helper", "ssh-auth-helper-api", "ssh-auth-helper-lib"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bytes = "1.12"
camino = { version = "1.2", features = ["serde1"] }
camino-tempfile = "1.4"
clap = { version = "4.6", features = ["derive", "env"] }
close_fds = "0.3.2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
jiff = { version = "0.2", default-features = false, features = ["serde", "std"] }
parking_lot = "0.12"
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = "1.53"
tokio-util = { version = "0.7", features = ["codec"] }
uuid = { version = "1.28", features = ["serde"] }

jsonrpc-uds = { path = "./jsonrpc-uds" }
ssh-auth-helper-lib = { path = "./ssh-auth-helper-lib" }
ssh-auth-helper-api = { path = "./ssh-auth-helper-api" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
checked_conversions = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
empty_enums = "warn"
explicit_deref_methods = "warn"
filter_map_next = "warn"
float_cmp = "warn"
inefficient_to_string = "warn"
large_futures = "warn"
lossy_float_literal = "warn"
manual_assert = "warn"
manual_let_else = "warn"
map_flatten = "warn"
match_same_arms = "warn"
mutex_atomic = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
rc_buffer = "warn"
redundant_clone = "warn"
ref_binding_to_reference = "warn"
semicolon_if_nothing_returned = "warn"
str_to_string = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
undocumented_unsafe_blocks = "deny"
unimplemented = "warn"
unused_async = "warn"
unused_self = "warn"

# Members opt in with [lints] workspace = true. Keep safety errors unconditional.
[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
non_ascii_idents = "forbid"
nonstandard_style = { level = "warn", priority = -1 }
redundant_imports = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_must_use = "deny"
